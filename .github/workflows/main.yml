name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile  # 👈 改用 pnpm 安装，并忽略锁文件冲突

      - name: Build Project
        run: pnpm run build                     # 👈 改用 pnpm 编译

      - name: Write wrangler.toml
        run: echo "${{ secrets.WRANGLER_TOML }}" > wrangler.toml

      - name: Publish to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          packageManager: pnpm                  # 👈 告诉 wrangler 用 pnpm